{% set name = "py7zr" %}
{% set version = "1.1.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/miurahr/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: ca38b5d1ed81d93e09055cc4c9ac38a63ea1ea219a573e45f99d267ff5c49470

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - py7zr = py7zr.__main__:main
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=80
    - setuptools-scm >=9.2.0
    - tomli
  run:
    - python
    - texttable
    - pycryptodomex >=3.20.0
    - brotli-python >=1.2.0
    - brotlicffi >=1.2.0.0
    - psutil
    - backports.zstd >=1.0.0  # [py<314]
    - pyppmd >=1.3.1
    - pybcj >=1.0.6
    - multivolumefile >=0.2.3
    - inflate64 >=1.0.4

# ERROR    root:test_concurrent.py:79 Caught error: <urlopen error [Errno 60] Operation timed out>
{% set deselect_tests = " --deselect=tests/test_concurrent.py::test_concurrent_futures" %}
# Posix tests failing on Windows:
{% set deselect_tests = deselect_tests + " --deselect=tests/test_archive.py::test_compress_files_encoded_header" %}  # [win]
{% set deselect_tests = deselect_tests + " --deselect=tests/test_archive.py::test_compress_files_1" %}  # [win]
# >       assert archive.header.files_info.files[3]["attributes"] == expected_attributes
# E       assert 2172682272 == 2147516448
{% set deselect_tests = deselect_tests + " --deselect=tests/test_badfiles.py::test_zip_slip_via_symlink" %}  # [win]
# >       assert archive.header.files_info.files[3]["attributes"] == expected_attributes
# E       assert 2172682272 == 2147516448
{% set deselect_tests = deselect_tests + " --deselect=tests/test_badfiles.py::test_extract_rejects_windows_unc_path" %}  # [win]
# >       return io.open(self, mode, buffering, encoding, errors, newline)
# E       OSError: [Errno 22] Invalid argument: 'test_zip_slip_via_symlink0\\extract\\attack_link\\evil.txt'
{% set deselect_tests = deselect_tests + " --deselect=tests/test_badfiles.py::test_extract_handles_trailing_dots_and_spaces" %}  # [win]
# >       with pytest.raises(Bad7zFile):
# E       Failed: DID NOT RAISE <class 'py7zr.exceptions.Bad7zFile'>
{% set deselect_tests = deselect_tests + " --deselect=tests/test_extract.py::test_register_unpack_archive_error" %}  # [win]

test:
  source_files:
    - tests
  imports:
    - py7zr
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests {{ deselect_tests }}
    - py7zr --help
  requires:
    - pip
    - pytest
    - pytest-benchmark
    - py-cpuinfo
    - requests
    - pytest-httpserver

about:
  description: |
    py7zr is a library and utility to support 7zip archive compression, decompression,
    encryption and decryption written by Python programming language.
  home: https://github.com/miurahr/py7zr
  dev_url: https://github.com/miurahr/py7zr
  doc_url: https://github.com/miurahr/py7zr#readme
  summary: Pure python 7-zip library
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sarthakpati